[package]
name = "hqcam"
version = "0.1.0"
edition = "2021"
description = "Coastal HQ CSI camera MJPEG streaming server"
license = "MIT"

[[bin]]
name = "hqcam"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
log = "0.4"
env_logger = "0.11"
jpeg-decoder = { version = "0.3", default-features = false }

[profile.release]
# perf-first (camera I/O loop) but still lean for the apt repo / Pi Zero.
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

# Packaging is hand-rolled (dpkg --build) to match ~/dev/tsr/receiver, NOT
# cargo-deb. See _package/ — control file, maintainer scripts, and the
# zigbuild matrix live there.
