<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hqcam</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1 id="name">hqcam</h1>
  <span id="live" class="pill">connecting…</span>
  <span id="temp" class="pill"></span>
</header>

<main>
  <section class="viewer">
    <img id="stream" src="/stream.mjpg" alt="Live camera view">
    <div class="actions">
      <button id="snap" class="primary">Take a Pic</button>
      <button id="record">Record</button>
    </div>
    <p id="snap-note" class="note"></p>
    <p id="record-note" class="note"></p>
  </section>

  <section id="photos-section">
    <div class="section-head">
      <h2>Pictures</h2>
      <span id="photo-count" class="note"></span>
    </div>
    <div id="photos" class="photos"></div>
    <button id="more" class="link" hidden>Show all</button>
  </section>

  <section>
    <h2>Status</h2>
    <dl id="status" class="status"></dl>
  </section>

  <section>
    <h2>Camera settings</h2>
    <div class="setting">
      <span class="label">Rotate</span>
      <div class="choices" id="rotation">
        <button data-rotation="0">0°</button>
        <button data-rotation="90">90°</button>
        <button data-rotation="180">180°</button>
        <button data-rotation="270">270°</button>
      </div>
      <p class="note">90° and 270° are done in software and make the camera run hotter. Mount the camera so 0° or 180° is upright if you can.</p>
    </div>
    <div class="setting">
      <span class="label">Mirror</span>
      <label><input type="checkbox" id="hflip"> Left↔right</label>
      <label><input type="checkbox" id="vflip"> Upside down</label>
    </div>
    <div class="setting">
      <span class="label">Focus</span>
      <div class="choices" id="focus">
        <button data-focus="auto">Auto</button>
        <button data-focus="0">Far away</button>
        <button data-focus="custom">Set distance…</button>
      </div>
      <div id="focus-custom" hidden>
        <label>Distance <input type="number" id="focus-metres" min="0.1" step="0.1" value="3"> m</label>
        <button id="focus-apply">Apply</button>
      </div>
      <p class="note">Camera Module 3 only. "Far away" stops the lens hunting when the camera shakes.</p>
    </div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
