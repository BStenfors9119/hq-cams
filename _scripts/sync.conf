# hqcam footage-sync configuration.
#
# Sourced by /usr/local/bin/hqcam-sync. After editing, apply with:
#   sudo systemctl restart hqcam-sync.timer   (or just wait for the next run)
#
# The deb installs this to /usr/local/etc/hqcam/sync.conf on first install only
# (it ships as sync.conf.default), so your settings survive upgrades.
#
# What sync does: when the Pi can reach HQ storage, it rsyncs the recorded clips
# off the USB drive to HQ and deletes the local copies to reclaim space. It runs
# only when reachable (i.e. back on HQ), never while the recorder is writing.

# Master switch. Must be "yes" to sync anything.
SYNC_ENABLED=no

# rsync-over-ssh destination: [user@]host:/path/ (note the trailing slash).
# Example: SYNC_DEST="hqcam@10.24.3.20:/srv/hqcam-footage/"
# The host must be reachable from HQ WiFi and accept the key below over SSH.
SYNC_DEST=""

# Local footage directory (the USB mount). Matches HQCAM_RECORD_DIR in record.conf.
SYNC_SOURCE="/media/hqcam"

# SSH identity for non-interactive auth. Generate a key on the Pi and install its
# public half on the HQ host (authorized_keys). Leave empty to use the default
# ssh keys for the user the service runs as (root).
#   sudo ssh-keygen -t ed25519 -f /usr/local/etc/hqcam/sync_id -N ""
#   ssh-copy-id -i /usr/local/etc/hqcam/sync_id.pub hqcam@10.24.3.20
SYNC_SSH_KEY=""

# SSH port on the HQ host (also used for the reachability pre-check).
SYNC_SSH_PORT=22

# Don't touch clips modified within this many seconds — avoids racing a segment
# the recorder is just finishing as we come online.
SYNC_MIN_AGE=30

# Remove local copies after they transfer in full (the point of syncing). Set to
# "no" to keep local copies too (drive fills faster; the recorder's ring buffer
# still prunes oldest when low).
SYNC_DELETE_AFTER=yes

# Upload rate cap in KB/s (0 = unlimited). Handy so a big backlog doesn't saturate
# the HQ link.
SYNC_BW_LIMIT=0
