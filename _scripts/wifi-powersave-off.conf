# Disable WiFi power management on the Pi's radio.
#
# Raspberry Pi OS enables WiFi power-save by default, which makes the (already
# weak) onboard radio miss beacons and time out associations exactly when the
# signal is marginal — e.g. connecting to HQ WiFi from the parking lot. Turning
# it off trades a little extra power draw for a much more reliable link at range.
#
# Installed to /etc/NetworkManager/conf.d/wifi-powersave-off.conf by the deb.
# Value 2 = disable powersave (0=default, 1=don't touch, 2=off, 3=on).
# Applies on the next connection activation (and every boot thereafter).

[connection]
wifi.powersave = 2
