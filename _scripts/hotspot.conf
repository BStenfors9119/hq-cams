# hqcam WiFi fallback-hotspot configuration.
#
# Sourced by /usr/local/bin/hqcam-hotspot. After editing, apply with:
#   sudo systemctl restart hqcam-hotspot.service
#
# The deb installs this to /usr/local/etc/hqcam/hotspot.conf on first install
# only (it ships as hotspot.conf.default), so your SSID/password survive upgrades.

# Name of the network the Pi broadcasts when HQ WiFi isn't reachable.
AP_SSID="hqcam"

# WPA2 passphrase for that network. MUST be at least 8 characters. CHANGE THIS.
AP_PASSWORD="hqcam1234"

# WiFi interface (wlan0 on every current Pi).
AP_IFACE="wlan0"

# NetworkManager connection profile name for the AP (rarely needs changing).
AP_CON_NAME="hqcam-ap"

# Seconds to wait for a known WiFi (e.g. HQ) at boot before falling back to AP.
# Kept generous: a weak parking-lot signal can take a while to associate + get a
# DHCP lease, and bailing to the AP too early strands the Pi on its own network.
AP_GRACE=90

# --- Periodic HQ rejoin while on the AP --------------------------------------
# Once the Pi is broadcasting its own AP it otherwise holds it until reboot. With
# this on, every AP_REJOIN_EVERY seconds it briefly drops the AP to look for HQ
# WiFi, so parking at HQ after roaming reconnects on its own. Set to 0 to disable.
AP_REJOIN_EVERY=600

# Seconds to wait for HQ during a rejoin attempt before restoring the AP. Kept
# short (unlike AP_GRACE) so the viewing interruption on a failed attempt is brief.
AP_REJOIN_GRACE=20

# Skip a rejoin attempt if a device is currently connected to the AP (i.e. someone
# is viewing), so we don't interrupt an active viewer. yes/no.
AP_REJOIN_SKIP_IF_CLIENTS=yes
