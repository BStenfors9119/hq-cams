# hqcam offline recorder configuration (optional).
#
# Read by the hqcam service as a systemd EnvironmentFile. Every setting has a
# built-in default, so this file is entirely optional — uncomment a line only to
# override. After editing, apply with:
#   sudo systemctl restart hqcam
#
# The deb installs this to /usr/local/etc/hqcam/record.conf on first install
# only (it ships as record.conf.default), so your edits survive upgrades.
#
# What the recorder does: while the camera is OFF the HQ network (so Motion Eye
# can't pull and store the feed), it saves the live stream to an attached USB
# drive as raw .mjpeg segment files under date folders. It never writes to the
# SD card — if no drive is mounted at HQCAM_RECORD_DIR, it simply skips saving.
#
# Set to 0 to turn the recorder off entirely (live stream is unaffected).
#HQCAM_RECORD=1

# --- Capture size / rate / quality -------------------------------------------
# Applies to BOTH the live stream and recordings. Read at startup — change, then
# `sudo systemctl restart hqcam`. Invalid values fall back to the default (logged).
#
# rpicam-vid encodes MJPEG in software, so CPU scales with width × height × fps.
#   Pi Zero 2 W: the defaults (1296x972 @ 15, q80) use ~20% CPU. 1640x1232 is the
#                IMX219's native full-view mode — sharpest detail.
#   Pi Zero W:   the defaults MAX OUT its single core (~4.5 fps, can drop WiFi).
#                Use 640x480 @ 10, quality 70 (~7 fps, ~67% CPU).
# Keep 4:3 sizes (640x480, 1296x972, 1640x1232) for the full field of view; 16:9
# sizes crop the top/bottom. Width/height must be even.
#HQCAM_WIDTH=1296
#HQCAM_HEIGHT=972
#HQCAM_FRAMERATE=15
# JPEG quality 1–100. Higher = cleaner detail but bigger frames (more storage/WiFi).
#HQCAM_QUALITY=80

# Colour profile (libcamera tuning file). Needed for NoIR "night" modules (black
# board): with the default profile, no IR filter makes everything pink/magenta.
# Ignored with a warning if the file doesn't exist. Pi Zero / 3 / 4 paths:
#   Camera Module v2 NoIR:      /usr/share/libcamera/ipa/rpi/vc4/imx219_noir.json
#   Camera Module 3 NoIR:       /usr/share/libcamera/ipa/rpi/vc4/imx708_noir.json
#   Camera Module 3 Wide NoIR:  /usr/share/libcamera/ipa/rpi/vc4/imx708_wide_noir.json
#HQCAM_TUNING_FILE=

# Fixed focus for autofocus modules (Camera Module 3 / IMX708 only — leave unset
# on a v2 / IMX219, which has no focus motor). Stops the lens hunting on vehicle
# vibration. Dioptres = 1 / distance in metres: 0 = infinity (dashcam),
# 0.5 = 2 m, 1 = 1 m, or "default" = the lens's hyperfocal position.
# Unset = rpicam-vid's own autofocus behaviour.
#HQCAM_LENS_POSITION=0

# --- Camera orientation ------------------------------------------------------
# Applied by rpicam-vid at the sensor/ISP level (free — no per-frame CPU — and
# the recorded footage inherits it). These set the INITIAL orientation at boot;
# it can also be changed live without editing this file via the HTTP endpoint:
#   curl 'http://<pi>:6877/orientation?rotation=180'      # set
#   curl 'http://<pi>:6877/orientation'                   # read current
# (HTTP changes are in-memory and revert to these values on restart.)
#
# Rotation is clockwise: 0, 90, 180 or 270. 0/180 and the flips are free
# (hardware). 90/270 (sideways mount; 270 = 90° counter-clockwise) are a lossless
# per-frame software rotate needing libturbojpeg0 — ~94 ms/frame on a Zero 2 W,
# so keep HQCAM_FRAMERATE <= 10 at 1640x1232. HFLIP/VFLIP take 1/true/yes/on.
# hflip+vflip together == rotation 180.
#HQCAM_ROTATION=0
#HQCAM_HFLIP=0
#HQCAM_VFLIP=0

# Where to record. MUST be a real mountpoint (the USB drive); otherwise nothing
# is written. See media-hqcam.mount for the drive-labelled-HQCAM auto-mount.
#HQCAM_RECORD_DIR=/media/hqcam

# --- Snapshots ("Take a Pic" in the web UI) ----------------------------------
# Unlike video, pictures may live on the SD card (so a camera without a USB
# drive still works); the folder is capped and the oldest are pruned past it.
#HQCAM_SNAPSHOT_DIR=/var/lib/hqcam/snapshots
#HQCAM_SNAPSHOT_MAX_MB=200

# Seconds per segment file before rotating to the next number (default 300 = 5m).
#HQCAM_SEGMENT_SECS=300

# Keep at least this many MB free on the drive; oldest segments are pruned to
# stay above it (ring buffer). Default 512.
#HQCAM_MIN_FREE_MB=512

# WiFi interface and hotspot profile name — used to tell "on HQ WiFi" from
# "offline". Match these to hotspot.conf if you changed them there.
#HQCAM_WIFI_IFACE=wlan0
#HQCAM_AP_CON=hqcam-ap

# How often (seconds) to re-check online/offline while idle or mid-segment.
#HQCAM_CHECK_SECS=5

# --- Motion-gated recording --------------------------------------------------
# Off by default: the recorder captures continuously while offline, which never
# misses anything. Turn this on to record ONLY around motion, so the drive fills
# with events instead of an empty scene. It analyses frames on-device, so it
# costs CPU — see HQCAM_MOTION_FPS.
#HQCAM_MOTION_GATED=false

# Frames per second to analyse for motion (not the recording rate). Higher =
# quicker to notice motion but more CPU. Decoding is the cost: fine at 3 on a
# quad-core Pi Zero 2 W, but on the original single-core Pi Zero drop to 1–2.
#HQCAM_MOTION_FPS=3

# How much must change to count as motion. SENSITIVITY is the fraction of the
# frame (a 40x30 grid) that must change — lower = more sensitive. CELL_THRESHOLD
# is the per-cell brightness delta (0–255) that counts as "changed", which
# filters sensor noise and gentle light drift — raise it if noise causes false
# triggers, lower it to catch subtler motion.
#HQCAM_MOTION_SENSITIVITY=0.02
#HQCAM_MOTION_CELL_THRESHOLD=18

# Keep recording this many seconds after motion stops, so a clip isn't cut off
# the instant a subject pauses (post-roll).
#HQCAM_MOTION_TIMEOUT=10

# Seconds of footage kept and prepended BEFORE each motion trigger, so the
# lead-up isn't lost (motion is only noticed after it starts). Pre-roll.
#HQCAM_PREROLL_SECS=3
